# nginx リバースプロキシ設定（fumen サブドメイン）
# 配置: /etc/nginx/conf.d/fumen.conf  （または sites-available + symlink）
#   FUMEN_DOMAIN を自分のドメインに置換してください（例: fumen.example.com）。
#
# まず HTTP のみで起動 → certbot で HTTPS を自動付与する想定:
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d fumen.example.com
# certbot が 443 のサーバブロックと証明書設定を自動で追記します。

server {
    listen 80;
    listen [::]:80;
    server_name fumen.example.com;   # ← 置換

    # アップロード/PDF を見込んで上限を緩める
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
